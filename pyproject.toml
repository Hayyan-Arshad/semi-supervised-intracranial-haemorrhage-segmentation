[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ich-segmentation"
version = "0.1.0"
description = "Reconstructed ICH segmentation experiments with Mean Teacher and SAM distillation"
requires-python = ">=3.9"
dependencies = ["torch>=2.2", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
sam = ["timm==0.9.16", "torchvision>=0.17", "opencv-python>=4.8"]
baselines = ["segmentation-models-pytorch>=0.3.4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ich*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
